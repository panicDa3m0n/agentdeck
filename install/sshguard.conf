# sshguard per AgentDeck (task O10.T5): blocca nel firewall gli indirizzi che sbagliano l'accesso SSH, ora che
# la porta è raggiungibile da internet. Installato in /etc/sshguard.conf da install/remote-access.sh.
# Documentazione: docs/accesso.md

# OpenSSH 10 scrive i login falliti con l'identificatore sshd-session.
LOGREADER="LANG=C /usr/bin/journalctl -afb -p info -n1 -t sshd -t sshd-session -o cat"

# Tabelle nftables proprie (ip e ip6 "sshguard"), separate da ogni altra regola.
BACKEND="/usr/lib/sshguard/sshg-fw-nft-sets"

# Valori predefiniti di sshguard, scritti per chiarezza: ogni tentativo vale 10 punti; a 30 punti in 30 minuti
# l'indirizzo è bloccato per 2 minuti, e il blocco raddoppia a ogni recidiva. Chi arriva a 120 punti finisce
# nella lista nera, che resta anche dopo un riavvio.
THRESHOLD=30
BLOCK_TIME=120
DETECTION_TIME=1800
BLACKLIST_FILE=120:/var/db/sshguard/blacklist.db

# Indirizzi mai bloccati: la Deck stessa e la rete di casa (INV-1).
WHITELIST_FILE=/etc/sshguard/whitelist
